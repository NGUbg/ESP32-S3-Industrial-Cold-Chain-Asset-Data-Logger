name: ESP-IDF Build CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.2

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build firmware
        working-directory: cold-chain-logger
        run: |
          . $IDF_PATH/export.sh
          idf.py set-target esp32s3
          idf.py build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            cold-chain-logger/build/cold-chain-logger.bin
            cold-chain-logger/build/bootloader/bootloader.bin
            cold-chain-logger/build/partition_table/partition-table.bin

  unit-test:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.2

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build unit tests
        working-directory: cold-chain-logger
        run: |
          . $IDF_PATH/export.sh
          idf.py set-target esp32s3
          idf.py -T test build

